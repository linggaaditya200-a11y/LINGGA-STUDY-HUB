<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>LINGGA STUDY HUB</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f1f4f9;--card:#fff;--ink:#14284b;--mut:#64748b;--line:#e2e8f0;--navy:#14284b;--navh:#1d3a6e;--soft:#eaf0fa;--bad:#b42318;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1526;--card:#15213a;--ink:#e6ecf7;--mut:#94a3b8;--line:#263553;--navy:#0a1325;--navh:#2a4a8a;--soft:#1c2c4d;--bad:#f87171;--warn:#fbbf24}}
:root[data-theme=dark]{--bg:#0d1526;--card:#15213a;--ink:#e6ecf7;--mut:#94a3b8;--line:#263553;--navy:#0a1325;--navh:#2a4a8a;--soft:#1c2c4d;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}i[data-lucide],svg.lucide{width:16px;height:16px;flex:none}
#side{position:fixed;inset:0 auto 0 0;width:260px;background:#14284b;color:#fff;padding:18px 12px;transform:translateX(-100%);transition:transform .25s;z-index:40;overflow:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
#side.open{transform:none}#side h1{font-size:16px;letter-spacing:.04em;margin:0 8px 2px}#side p{font-size:12px;opacity:.7;margin:0 8px 18px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#fff;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;transition:background .15s}
.nv:hover{background:rgba(255,255,255,.1)}.nv.on{background:rgba(255,255,255,.18);font-weight:600}
#wrap{min-height:100vh}header{position:sticky;top:0;z-index:30;display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
#main{padding:16px;max-width:1100px}.sr{position:relative;flex:1}.sr i,.sr svg{position:absolute;left:10px;top:10px;color:var(--mut)}.sr input{padding-left:34px}
.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);outline:none}.inp:focus,.btn:focus-visible,.b2:focus-visible,.nv:focus-visible{outline:2px solid var(--navh);outline-offset:1px}
.btn{display:inline-flex;gap:6px;align-items:center;border:0;background:var(--navh);color:#fff;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5}
.b2{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);background:var(--card);padding:4px 9px;border-radius:8px;font-size:12px;cursor:pointer}.b2:hover{background:var(--soft)}.b2.d{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.g{display:grid;gap:12px}.g4{grid-template-columns:repeat(2,1fr)}.g2,.gf{grid-template-columns:1fr}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut);font-size:12px}.tag{color:var(--navh);font-size:12px}.num{font-size:26px;font-weight:700}
.f{display:flex;gap:10px}.f>div{min-width:0}.f b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{font-size:11px;border-radius:99px;padding:1px 8px;background:var(--soft)}.pill.w{color:var(--warn)}.pill.r{color:var(--bad)}
.emp{text-align:center;color:var(--mut);padding:24px}#md{position:fixed;inset:0;background:rgba(10,19,37,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:60}
#md>div{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto}#md form{display:grid;gap:8px}
.dz{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;color:var(--mut)}.dz.on{border-color:var(--navh);background:var(--soft)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navh);color:#fff;padding:8px 14px;border-radius:9px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}#toast.on{opacity:1}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--navh);transition:width .2s}
@media(min-width:860px){#side{transform:none}#wrap{margin-left:260px}#mb{display:none}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.gf{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<aside id="side"><h1>LINGGA STUDY HUB</h1><p>Satu Tempat untuk Semua Perjalanan Akademikmu.</p><nav id="nav"></nav></aside>
<div id="wrap"><header><button class="b2" id="mb" data-a="menu" aria-label="Menu"><i data-lucide="menu"></i></button>
<div class="sr"><i data-lucide="search"></i><input class="inp" id="q" placeholder="Cari nama, mata kuliah, tag, semester, tanggal…"></div>
<span class="pill" id="sy" title="Status database">Menghubungkan…</span><button class="btn" data-a="up" data-c="materi"><i data-lucide="upload"></i>Unggah</button></header>
<main id="main"></main></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.441.0/dist/umd/lucide.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const V={dash:['Dashboard','layout-dashboard'],all:['Semua File','files'],tugas:['Tugas Kuliah','clipboard-list'],materi:['Materi Kuliah','book-open'],notes:['Catatan Kuliah','sticky-note'],presentasi:['Presentasi dan Makalah','presentation'],course:['Berdasarkan Mata Kuliah','folder-tree'],fav:['Favorit','star'],trash:['Tempat Sampah','trash-2'],set:['Pengaturan','settings']};
const EXT=['pdf','doc','docx','ppt','pptx','xls','xlsx','txt','jpg','jpeg','png','zip'],MAX=25*1048576,ST=['Belum Dikerjakan','Sedang Dikerjakan','Selesai','Sudah Dikumpulkan'],CAT=['tugas','materi','catatan','presentasi','laporan','lainnya'];
const D={files:[],tasks:[],notes:[],courses:[]};let db,view='dash',q='',sort='new',grid=true,cf='',cid='',nid='',dl=null;
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('lingga-study-hub',1);r.onupgradeneeded=()=>Object.keys(D).forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(s,m,f)=>new Promise((ok,no)=>{const t=db.transaction(s,m),o=f(t.objectStore(s));t.oncomplete=()=>ok(o&&o.result);t.onerror=()=>no(t.error)});
const AOK=['pdf','txt','jpg','jpeg','png'];let RM=null,AS=null;
const SYNC=m=>{const e=$('#sy');if(e){e.textContent={ok:'Database terhubung',off:'Mode lokal',err:'Sinkron gagal'}[m];e.className='pill'+(m==='ok'?'':m==='err'?' r':' w')}};
async function pub(s,o){if(!RM)return;try{const {blob,...r}=o;if(s==='files'&&blob&&!o.aid&&AS&&AOK.includes(ext(o.name))){try{const u=await AS.upload(blob);o.aid=r.aid=u.id}catch(e){}}await RM.doc(s+'_'+o.id).set({_t:s,...JSON.parse(JSON.stringify(r))});SYNC('ok')}catch(e){SYNC('err')}}
async function save(s,o){const i=D[s].findIndex(x=>x.id===o.id);i<0?D[s].push(o):D[s][i]=o;await pub(s,o);if(db)await tx(s,'readwrite',x=>x.put(o))}
async function rm(s,id){const o=D[s].find(x=>x.id===id);D[s]=D[s].filter(x=>x.id!==id);if(RM){try{await RM.doc(s+'_'+id).delete();if(o&&o.aid&&AS)await AS.delete(o.aid)}catch(e){}}if(db)await tx(s,'readwrite',x=>x.delete(id))}
async function init2(){try{const u=await claude.use('user'),d=await claude.use('db'),id=u&&await u.id();if(!d||!id)return SYNC('off');RM=d.collection('data/users/'+id);AS=await claude.use('assets');const snap=await RM.get(),seen=new Set();
for(const x of snap.docs){const r=x.data()||{},s=r._t;if(!D[s])continue;seen.add(x.id);const {_t,...o}=r,i=D[s].findIndex(z=>z.id===o.id);if(i>=0&&D[s][i].blob)o.blob=D[s][i].blob;i<0?D[s].push(o):D[s][i]=o;if(db)await tx(s,'readwrite',y=>y.put(o))}
for(const s in D)for(const o of [...D[s]])if(!seen.has(s+'_'+o.id))await pub(s,o);SYNC('ok')}catch(e){SYNC('off')}}
async function gb(f){if(f.blob)return f.blob;if(!f.aid)throw Error('File ini tersimpan di perangkat lain (format Office/ZIP tidak ikut tersinkron).');const r=await fetch('/_blob/'+f.aid);if(!r.ok)throw Error('Gagal mengambil file dari penyimpanan.');f.blob=await r.blob();if(db)await tx('files','readwrite',x=>x.put(f));return f.blob}
const uid=()=>crypto.randomUUID(),tgl=d=>d?new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'-';
const sz=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.ceil(n/1024))+' KB',cn=id=>D.courses.find(c=>c.id===id)?.name||'Tanpa mata kuliah';
const ext=n=>(n.split('.').pop()||'').toLowerCase(),tags=s=>(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const fic=n=>({pdf:'file-text',doc:'file-type',docx:'file-type',ppt:'presentation',pptx:'presentation',xls:'sheet',xlsx:'sheet',jpg:'image',jpeg:'image',png:'image',zip:'file-archive'}[ext(n)]||'file');
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),2600)};
const live=()=>D.files.filter(f=>!f.del),opt=(a,v,all)=>(all?`<option value="">${all}</option>`:'')+a.map(x=>`<option value="${esc(x[0])}"${x[0]===v?' selected':''}>${esc(x[1])}</option>`).join('');
const cop=v=>opt(D.courses.map(c=>[c.id,c.name]),v,'Pilih mata kuliah');
const nm=()=>ls('nm')||'Mahasiswa';
function fl(items,empty){let L=items.filter(f=>[f.name,f.desc,cn(f.course),f.cat,f.sem,f.year,tgl(f.created),...(f.tags||[])].join(' ').toLowerCase().includes(q.toLowerCase())&&(!cf||f.course===cf));
 L.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='cat'?a.cat.localeCompare(b.cat):sort==='old'?a.created-b.created:b.created-a.created);
 return `<div class="row" style="margin-bottom:12px"><select class="inp" style="width:auto" id="sc">${opt(D.courses.map(c=>[c.id,c.name]),cf,'Semua mata kuliah')}</select><select class="inp" style="width:auto" id="so">${opt([['new','Terbaru'],['old','Terlama'],['name','Nama'],['cat','Kategori']],sort)}</select><button class="b2" data-a="gv"><i data-lucide="${grid?'list':'layout-grid'}"></i>${grid?'Daftar':'Grid'}</button></div>`+
 (L.length?`<div class="g ${grid?'gf':''}">${L.map(card).join('')}</div>`:`<div class="card emp">${q?`Tidak ada hasil untuk “${esc(q)}”.`:empty}</div>`)}
function card(f){const b=f.del?`<button class="b2" data-a="fr" data-id="${f.id}"><i data-lucide="rotate-ccw"></i>Pulihkan</button><button class="b2 d" data-a="fp" data-id="${f.id}">Hapus permanen</button>`:
 `<button class="b2" data-a="fo" data-id="${f.id}"><i data-lucide="eye"></i>Buka</button><button class="b2" data-a="fd" data-id="${f.id}"><i data-lucide="download"></i>Unduh</button><button class="b2" data-a="ff" data-id="${f.id}" aria-label="Favorit"><i data-lucide="star" ${f.fav?'fill="currentColor"':''}></i></button><button class="b2" data-a="fe" data-id="${f.id}"><i data-lucide="pencil"></i>Ubah</button><button class="b2 d" data-a="ft" data-id="${f.id}" aria-label="Hapus"><i data-lucide="trash-2"></i></button>`;
 return `<div class="card"><div class="f"><i data-lucide="${fic(f.name)}" style="width:24px;height:24px;color:var(--navh)"></i><div><b>${esc(f.name)}</b><span class="mut">${esc(cn(f.course))} · ${f.cat} · ${tgl(f.created)} · ${sz(f.size)}</span>${f.sem||f.year?`<br><span class="mut">Semester ${esc(f.sem||'-')} · ${esc(f.year||'-')}${f.meet?' · Pertemuan '+f.meet:''}${f.topic?' · '+esc(f.topic):''}</span>`:''}${f.tags?.length?`<br><span class="tag">${f.tags.map(t=>'#'+esc(t)).join(' ')}</span>`:''}</div></div><div class="row" style="margin-top:10px">${b}</div></div>`}
function dash(){const op=D.tasks.filter(t=>!['Selesai','Sudah Dikumpulkan'].includes(t.status)).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')),h=new Date().getHours(),sp=h<11?'pagi':h<15?'siang':h<18?'sore':'malam';
 return `<h2 style="margin:0">Selamat ${sp}, ${esc(nm())}</h2><p class="mut" style="margin:2px 0 14px">Satu Tempat untuk Semua Perjalanan Akademikmu.</p><div class="g g4">${[['Tugas',D.tasks.length],['Materi',live().filter(f=>f.cat==='materi').length],['Catatan',D.notes.length],['File baru (7 hari)',live().filter(f=>Date.now()-f.created<6048e5).length]].map(x=>`<div class="card"><div class="num">${x[1]}</div><div class="mut">${x[0]}</div></div>`).join('')}</div>
 <div class="row" style="margin:14px 0"><button class="btn" data-a="tn"><i data-lucide="plus"></i>Tambah tugas</button><button class="btn" data-a="up" data-c="materi"><i data-lucide="plus"></i>Tambah materi</button><button class="btn" data-a="nn"><i data-lucide="plus"></i>Tambah catatan</button><button class="btn" data-a="up" data-c="lainnya"><i data-lucide="plus"></i>Tambah dokumen</button></div>
 <div class="g g2"><section><h3>File terbaru</h3><div class="g">${live().sort((a,b)=>b.created-a.created).slice(0,4).map(card).join('')||'<div class="card emp">Belum ada file. Unggah file pertamamu.</div>'}</div></section>
 <section><h3>Tugas belum selesai</h3><div class="g">${op.slice(0,6).map(trow).join('')||'<div class="card emp">Tidak ada tugas tertunda.</div>'}</div></section></div>`}
function trow(t){const d=t.due?Math.ceil((new Date(t.due)-new Date().setHours(0,0,0,0))/864e5):null,done=['Selesai','Sudah Dikumpulkan'].includes(t.status);
 return `<div class="card"><div class="row" style="justify-content:space-between"><div><b>${esc(t.title)}</b> ${!done&&d!==null&&d<0?'<span class="pill r">Terlambat</span>':!done&&d!==null&&d<=3?'<span class="pill w">Mendekati tenggat</span>':''}<div class="mut">${esc(cn(t.course))} · Tenggat ${tgl(t.due)}</div></div>
 <div class="row"><select class="inp" style="width:auto;padding:4px" data-ts="${t.id}">${opt(ST.map(s=>[s,s]),t.status)}</select>${t.file?`<button class="b2" data-a="fo" data-id="${t.file}"><i data-lucide="paperclip"></i></button>`:''}<button class="b2" data-a="te" data-id="${t.id}">Ubah</button><button class="b2 d" data-a="td" data-id="${t.id}" aria-label="Hapus"><i data-lucide="trash-2"></i></button></div></div></div>`}
function tugas(){let L=D.tasks.filter(t=>(!cf||t.course===cf)&&(!dl||t.status===dl)&&[t.title,t.desc,cn(t.course)].join(' ').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
 return `<div class="row" style="margin-bottom:12px"><button class="btn" data-a="tn"><i data-lucide="plus"></i>Tambah tugas</button><select class="inp" style="width:auto" id="sc">${opt(D.courses.map(c=>[c.id,c.name]),cf,'Semua mata kuliah')}</select><select class="inp" style="width:auto" id="ss">${opt(ST.map(s=>[s,s]),dl||'','Semua status')}</select></div><div class="g">${L.map(trow).join('')||'<div class="card emp">Belum ada tugas yang cocok. Klik “Tambah tugas”.</div>'}</div>`}
function notes(){const n=D.notes.find(x=>x.id===nid),L=D.notes.filter(x=>[x.title,x.body,...(x.tags||[])].join(' ').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.upd-a.upd);
 return `<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="g" style="align-content:start"><button class="btn" data-a="nn"><i data-lucide="plus"></i>Catatan baru</button><div id="nl" class="g">${nlist(L)}</div></div>
 ${n?`<div class="card g" style="grid-column:span 2;min-width:0"><input class="inp" id="nt" value="${esc(n.title)}" style="font-weight:600"><div class="row"><select class="inp" style="flex:1" id="nc">${cop(n.course)}</select><input class="inp" style="flex:1" id="nk" placeholder="Kategori" value="${esc(n.cat)}"><input class="inp" style="flex:1" id="ng" placeholder="Tag (pisah koma)" value="${esc((n.tags||[]).join(', '))}"></div><textarea class="inp" id="nb" style="min-height:320px" placeholder="Tulis catatanmu…">${esc(n.body)}</textarea><div id="ao" class="card mut" hidden style="white-space:pre-wrap"></div><div class="row" style="justify-content:space-between"><span class="mut" id="ns">Perubahan tersimpan otomatis</span><span class="row"><button class="b2" data-a="ai"><i data-lucide="sparkles"></i>Ringkas dengan AI</button><button class="b2 d" data-a="nd">Hapus catatan</button></span></div></div>`:'<div class="card emp" style="grid-column:span 2">Pilih atau buat catatan.</div>'}</div>`}
const nlist=L=>L.map(x=>`<button class="card" style="text-align:left;cursor:pointer;${x.id===nid?'border-color:var(--navh)':''}" data-a="ns" data-id="${x.id}"><b>${esc(x.title)}</b><div class="mut">${esc(cn(x.course))} · ${tgl(x.upd)}</div></button>`).join('')||'<div class="mut">Belum ada catatan.</div>';
function course(){if(cid){const c=D.courses.find(x=>x.id===cid);if(c){cf=cid;return `<button class="b2" data-a="cb"><i data-lucide="arrow-left"></i>Semua mata kuliah</button><h2>${esc(c.name)}</h2><h3>Tugas</h3><div class="g">${D.tasks.filter(t=>t.course===cid).map(trow).join('')||'<div class="mut">Belum ada tugas.</div>'}</div><h3>Catatan</h3><div class="g">${nlist(D.notes.filter(n=>n.course===cid))}</div><h3>File</h3>${fl(live(),'Belum ada file di folder ini.')}`}}
 return `<form class="row" id="cfm" style="margin-bottom:12px"><input class="inp" style="flex:1" name="n" placeholder="Nama mata kuliah baru" required><button class="btn"><i data-lucide="plus"></i>Tambah</button></form><div class="g gf">${D.courses.map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="mut">${live().filter(f=>f.course===c.id).length} file · ${D.tasks.filter(t=>t.course===c.id).length} tugas · ${D.notes.filter(t=>t.course===c.id).length} catatan</div><div class="row" style="margin-top:8px"><button class="b2" data-a="co" data-id="${c.id}">Buka folder</button><button class="b2" data-a="cr" data-id="${c.id}">Ganti nama</button><button class="b2 d" data-a="cd" data-id="${c.id}" aria-label="Hapus"><i data-lucide="trash-2"></i></button></div></div>`).join('')||'<div class="card emp">Belum ada mata kuliah.</div>'}</div>`}
function sett(){return `<div class="card g" style="max-width:460px"><label>Nama panggilan<input class="inp" id="un" value="${esc(nm())}"></label><div class="row"><button class="b2" data-a="th">Ganti tema terang/gelap</button><button class="b2" data-a="ex"><i data-lucide="download"></i>Ekspor daftar file (JSON)</button><button class="b2 d" data-a="rs">Hapus semua data</button></div><p class="mut">Data disimpan di database akunmu (privat) dan di cache browser. File PDF, TXT, JPG, dan PNG ikut tersinkron antar perangkat; file Office dan ZIP tetap di perangkat ini.</p></div>`}
const VW={dash,all:()=>fl(live(),'Belum ada file. Klik Unggah untuk menambahkan.'),tugas,materi:()=>`<button class="btn" style="margin-bottom:12px" data-a="up" data-c="materi"><i data-lucide="upload"></i>Unggah materi</button>`+fl(live().filter(f=>f.cat==='materi'),'Belum ada materi.'),notes,presentasi:()=>`<button class="btn" style="margin-bottom:12px" data-a="up" data-c="presentasi"><i data-lucide="upload"></i>Unggah</button>`+fl(live().filter(f=>['presentasi','laporan'].includes(f.cat)),'Belum ada presentasi atau makalah.'),course,fav:()=>fl(live().filter(f=>f.fav),'Belum ada favorit. Klik bintang pada file.'),trash:()=>fl(D.files.filter(f=>f.del),'Tempat sampah kosong.'),set:sett};
function R(){$('#nav').innerHTML=Object.entries(V).map(([k,v])=>`<button class="nv${k===view?' on':''}" data-a="nav" data-v="${k}"><i data-lucide="${v[1]}"></i>${v[0]}</button>`).join('');$('#main').innerHTML=VW[view]();window.lucide&&lucide.createIcons()}
